<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeshTalk Web Preview</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Inter:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="mobile-frame">
        <div id="app">
            <!-- Main Screen -->
            <section id="main" class="screen active">
                <div class="hero-section">
                    <div class="lightning-logo">⚡</div>
                    <h1 class="brand-title">MeshTalk</h1>
                    <div class="status-indicator">NEURAL OFFLINE GRID: ACTIVE</div>
                </div>

                <div class="action-buttons">
                    <button class="btn-orange" onclick="showScreen('chat')">
                        <span>🚀</span> BROADCAST
                    </button>
                    <button class="btn-teal" onclick="showScreen('config')">
                        <span>➕</span> LINK PEER
                    </button>
                </div>

                <div class="secondary-actions">
                    <button class="btn-dark" onclick="alert('Initializing Grid Map...')">MESH</button>
                    <button class="btn-dark" onclick="alert('Viewing Zedox Guide...')">GUIDE</button>
                </div>

                <div class="bottom-identity">
                    <div class="identity-info">
                        <span class="label">RADIO IDENTITY</span>
                        <span class="value">ZEDOXNODE-9835</span>
                    </div>
                    <button class="settings-btn" onclick="showScreen('config')">⚙️</button>
                </div>
            </section>

            <!-- Chat / Broadcast Screen -->
            <section id="chat" class="screen">
                <div class="header">
                    <button class="back-btn" onclick="showScreen('main')">‹</button>
                    <div class="header-info">
                        <h2>BROADCAST CHANNEL</h2>
                        <span class="subtitle">ZEDOX OFFLINE PROTOCOL</span>
                    </div>
                </div>
                <div class="toggles">
                    <button class="toggle active">MESH BROADCAST</button>
                    <button class="toggle">PRIVATE LINK</button>
                </div>
                <div class="chat-content">
                    <div class="no-traffic">NO TRAFFIC DETECTED</div>
                </div>
                <div class="input-area">
                    <div class="input-card">
                        <input type="text" placeholder="Type signal...">
                        <button class="send-btn">➡️</button>
                    </div>
                </div>
            </section>

            <!-- Node Config Screen -->
            <section id="config" class="screen">
                <div class="header">
                    <button class="back-btn" onclick="showScreen('main')">‹</button>
                    <h2>NODE CONFIG</h2>
                </div>
                <div class="config-content">
                    <span class="label-tiny">NODE IDENTITY HUB</span>
                    <h3 class="node-name">ZedoxNode</h3>
                    <button class="btn-orange-small">UPDATE ID</button>

                    <div class="spectra-section">
                        <h4>MY PAIRING SPECTRA</h4>
                        <div class="qr-box">
                            <div class="qr-mock"></div>
                        </div>
                    </div>

                    <div class="sync-card">
                        <span class="label-tiny">UNIQUE SYNC CODE</span>
                        <div class="sync-code">899835</div>
                    </div>

                    <div class="config-nav">
                        <button class="nav-item btn-teal">
                            <span>📷</span> PAIRING
                        </button>
                        <button class="nav-item btn-dark">
                            <span>👥</span> PEERS
                        </button>
                    </div>
                </div>
            </section>
        </div>
    </div>
    <script src="js/main.js"></script>
</body>

</html>
